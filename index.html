<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ben Siran Academy – IELTS Verb Lab &amp; Speaking Masterclass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Vazirmatn:wght@400;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--ink:#1c2429;--paper:#efeadb;--card:#f8f5ec;--teal:#1b8a86;--cop:#b0653a;--navy:#12384f;--mut:#5b6469;--line:#cfc7b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#ece6d6;--paper:#161c20;--card:#1f272c;--mut:#a3adb1;--line:#34414a;--navy:#8fc9d3}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
.fa{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;unicode-bidi:isolate}
main,header>div,footer>div{max-width:1040px;margin:auto;padding:0 20px}
header{padding:56px 0 40px;text-align:center;border-bottom:3px double var(--cop)}
.logo{width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--cop),0 18px 40px #0003;background:#efeadb}
h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:900;margin:26px 0 8px;letter-spacing:-.02em}
.sub{font-size:1.15rem;color:var(--mut);max-width:620px;margin:0 auto 22px}
.cand{display:inline-block;border:1.5px solid var(--cop);padding:10px 22px;border-radius:40px;background:var(--card)}
.cand b{font-family:Fraunces,serif;font-size:1.2rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav a{display:inline-block;padding:13px 16px;color:var(--ink);text-decoration:none;font-weight:600}
nav a:hover,nav a:focus-visible{color:var(--cop);outline:none;box-shadow:inset 0 -3px var(--cop)}
section{padding:56px 0 8px}
h2{font-size:clamp(1.8rem,4.5vw,2.8rem);margin-bottom:6px}
.lead{color:var(--mut);margin:0 0 26px;max-width:680px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);padding:16px 18px;border-radius:4px 14px 4px 14px}
.c.cp{border-left-color:var(--cop)}
.c h3{font-size:1.2rem;margin-bottom:4px}.c p{margin:4px 0;font-size:.97rem}
.v{color:var(--teal);font-weight:700}.n{color:var(--cop);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{font:600 1rem Figtree,sans-serif;padding:10px 18px;border-radius:30px;border:1.5px solid var(--navy);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(prefers-color-scheme:dark){.tabs button[aria-selected=true]{color:#10181c}}
button:focus-visible{outline:3px solid var(--cop);outline-offset:2px}
.pane{display:none}.pane.on{display:block}
.tl{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.p{background:var(--navy);color:#f3efe4;padding:22px;border-radius:18px 4px 18px 4px}
.p h3{font-size:1.6rem;color:#e7b48a}.p .t{font-size:2.2rem;font-family:Fraunces,serif;font-weight:900}
.p ul{padding-left:18px;margin:8px 0 0}
.reds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.reds button{font:900 2.6rem Fraunces,serif;padding:14px 0;border-radius:14px;border:2px solid var(--cop);background:var(--card);color:var(--cop);cursor:pointer}
.reds button[aria-pressed=true]{background:var(--cop);color:#fff}
.out{background:var(--card);border:1px dashed var(--cop);padding:18px;border-radius:12px;min-height:130px}
.out h3{font-size:1.3rem;margin-bottom:6px}.q{color:var(--mut);font-style:italic}.a{margin:6px 0 0}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:.96rem}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:Fraunces,serif;color:var(--cop)}
.wrap{overflow-x:auto}
.note{background:var(--card);border-left:5px solid var(--cop);padding:14px 18px;margin:18px 0;border-radius:4px}
.chips span{display:inline-block;background:var(--card);border:1px solid var(--teal);border-radius:20px;padding:3px 12px;margin:3px 3px 3px 0;font-size:.93rem}
a{color:var(--teal);font-weight:600}
footer{margin-top:64px;background:var(--navy);color:#f3efe4;padding:34px 0;text-align:center}
footer a{color:#e7b48a}
@media print{nav{display:none}}
</style></head><body>
